<body>
  <!-- Menu carregado dinamicamente -->
  <div id="menu"></div>

  <div class="wrap">
    <header>
      <h1>Quem é esse Pokémon?</h1>
    </header>

    <div class="card game">
      <div class="left">
        <div class="silhouette-wrap">
          <img id="pokeImg" class="poke-img hidden" alt="Pokémon misterioso" style="visibility: hidden" />
        </div>

        <div class="input-wrap">
          <input id="answerInput" type="text" placeholder="Digite o nome..." disabled />
          <button id="submitBtn" class="primary" disabled>Enviar</button>
          <button id="nextBtn" class="primary" disabled>Próximo</button>
        </div>
        <div id="feedback" class="feedback" role="status" aria-live="polite">Carregando Pokémon...</div>
      </div>
    </div>
  </div>

  <script src="quem_e_esse_pokemon.js"></script>
